<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LumoLifts - Uplifting Shorts</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
            text-align: center;
        }

        header {
            background: linear-gradient(135deg, #ffeb3b, #ff9800);
            padding: 20px;
            color: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        header h1 {
            margin: 0;
            font-size: 2.5em;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }

        .description {
            font-size: 1.2em;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #ff9800;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .button:hover {
            background-color: #fb8c00;
        }

        footer {
            margin-top: 30px;
            padding: 10px;
            background-color: #333;
            color: white;
            font-size: 0.9em;
        }
    </style>
</head>

<body>
    <header>
        <h1>LumoLifts</h1>
    </header>
    <div class="container">
        <p class="description">
            Welcome to LumoLifts! Bright, bite-sized bursts of positivity to light up your day.
            Catch uplifting quotes, good vibes, and quick inspiration—all in 60 seconds or less.

        </p>
